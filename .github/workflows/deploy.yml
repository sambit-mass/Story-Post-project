name: Deploy to EC2

on:
workflow_dispatch:   # 👈 manual trigger

jobs:
deploy:
runs-on: ubuntu-latest

```
steps:
  - name: Deploy via SSH
    uses: appleboy/ssh-action@v1.0.3
    with:
      host: \${{ secrets.EC2_HOST }}
      username: \${{ secrets.EC2_USER }}
      key: \${{ secrets.EC2_SSH_KEY }}
      script: |
        cd ~/your-repo
        git pull origin main
        docker-compose up -d
```
